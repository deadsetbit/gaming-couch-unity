name: docfx-unitypackage

# Builds the package's documentation site and deploys it to the PUBLIC repository.
#
# The build stays here because the site is generated from the package's sources, and the
# deploy goes elsewhere because a private repository on our plan cannot serve Pages at all.
# Only rendered HTML crosses the boundary.
#
# The action assembles a site out of package conventions read from the workspace root and
# takes no path input, so the workspace root is made into the package rather than the action
# being taught about subfolders.

on:
  push:
    tags:
      - 'unity-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose documentation to publish, e.g. unity-0.1.0-alpha.8'
        required: true

# The deploy authenticates with the scoped deploy key, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: publish-docs
  cancel-in-progress: false

env:
  # Each release deploys into a folder named for its own version and nothing overwrites it,
  # because the URL is frozen into an immutable tag and the plan forbids republishing. The
  # site root redirects to the latest stable release; a prerelease publishes its folder and
  # leaves the root where it is.
  DOCS_SITE_ROOT: https://deadsetbit.github.io/gaming-couch-unity-public/
  # A link, never a fetch, so it needs no CORS and no uptime from the docs host and still
  # works from a page whose site has been retired.
  DOCS_HOME_URL: https://gamingcouch.com
  PUBLIC_REPO: deadsetbit/gaming-couch-unity-public

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve the release tag
        id: release
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          tag="${DISPATCH_TAG:-${GITHUB_REF#refs/tags/}}"
          # Checked against the whole tag format, not a prefix: this value reaches a shell
          # and $GITHUB_OUTPUT, and `[[ =~ ]]` anchors across the entire string so an
          # embedded newline fails it.
          if [[ ! "$tag" =~ ^unity-[A-Za-z0-9][A-Za-z0-9.+-]*$ ]]; then
            echo "::error::'$tag' is not a unity-<version> release tag."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # The tag pattern above already limits this to one safe path segment: it must open
          # with an alphanumeric, so it can be neither empty nor a traversal.
          version="${tag#unity-}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base_url=${DOCS_SITE_ROOT}${version}/" >> "$GITHUB_OUTPUT"

          # Semver: anything after the first hyphen is a prerelease identifier.
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 1
          path: src

      - name: Refuse a tag from before the restructure
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [ ! -d src/public/package ] || [ ! -f src/Tools/check-dist-complete.py ]; then
            echo "::error::$TAG predates the public/package/ restructure."
            exit 1
          fi

      # The same gates the release publish runs, for the same reason. The docs site renders
      # README.md and CHANGELOG.md as pages, so a package this refuses to mirror must not have
      # its contents published here as HTML instead. Gated before staging, because staging
      # deletes the folder the gate scripts live in.
      - name: Install the secret scanner
        uses: ./src/.github/actions/install-secret-scanner

      - name: Gate — runtime identity
        working-directory: src
        run: python3 Tools/check-runtime-package-info.py

      - name: Gate — publish completeness
        working-directory: src
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: python3 Tools/check-dist-complete.py public/package "$TAG"

      - name: Stage the package as the workspace root
        shell: bash
        run: |
          shopt -s dotglob
          mv src/public/package/* .
          rm -rf src
          # The API reference is generated from every .cs file under this root, and the tests
          # ship with the package. They are not API a game author calls, and there are more
          # test types than real ones in the global namespace, so they are staged out here
          # rather than published. This affects the site only: the package the mirror
          # publishes is built by publish-mirror.yml from an untouched tree.
          if [ ! -d Tests ]; then
            echo "::error::no Tests/ to stage out — the API reference would publish test types."
            exit 1
          fi
          rm -rf Tests Tests.meta

      # No github_token: the action reads it only to look up the running repository's Pages
      # configuration, which base_url replaces.
      #
      # base_url is this release's own folder; site_root_url is the root above it, shared by
      # every release, and is what the version manifest is resolved against.
      - name: Build
        uses: deadsetbit/docfx-unitypackage@v1.2.0
        with:
          base_url: ${{ steps.release.outputs.base_url }}
          site_root_url: ${{ env.DOCS_SITE_ROOT }}
          home_url: ${{ env.DOCS_HOME_URL }}

      # Checked here rather than after the deploy, because a page that ships without these is
      # frozen without them: the tag is immutable and the plan forbids republishing.
      - name: Assert the built site carries this release's URLs
        shell: bash
        env:
          BASE_URL: ${{ steps.release.outputs.base_url }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          grep -qF "$BASE_URL" _site/sitemap.xml || {
            echo "::error::the built sitemap does not carry $BASE_URL."
            exit 1
          }

          # Null-delimited: the action turns 'Third Party Notices.md' into a page, so a built
          # path can carry spaces. toc.html files are navigation fragments, not pages.
          checked=0
          missing=0
          while IFS= read -r -d '' page; do
            checked=$((checked + 1))
            for needle in \
              "data-docs-version=\"$VERSION\"" \
              "data-docs-manifest=\"${DOCS_SITE_ROOT}versions.json\"" \
              "href=\"$DOCS_HOME_URL\""; do
              grep -qF "$needle" "$page" || {
                echo "::error::$page is missing: $needle"
                missing=1
              }
            done
          done < <(find _site -name '*.html' -not -path '_site/public/*' -not -name 'toc.html' -print0)

          test "$checked" -gt 0 || { echo "::error::no pages were built."; exit 1; }
          test "$missing" -eq 0 || exit 1
          echo "$checked pages carry this release's version, manifest URL and link home."

      # No keep_files: the action's cleanup is a `git rm` run with the working directory set
      # to destination_dir, so it can reach only this version's folder. Leaving it off is what
      # stops a type deleted from the package keeping its API page inside this release.
      - name: Deploy this release's documentation
        uses: peaceiris/actions-gh-pages@v3
        with:
          external_repository: ${{ env.PUBLIC_REPO }}
          deploy_key: ${{ secrets.GAMING_COUCH_UNITY_PUBLIC_DEPLOY_KEY }}
          publish_branch: gh-pages
          publish_dir: _site
          destination_dir: ${{ steps.release.outputs.version }}

      # Publishing is not the same as being newest. A tag push can cut a patch on an older
      # line, and this workflow also takes a tag by dispatch, so a release reaching this point
      # is not necessarily ahead of whatever the root already names.
      - name: Decide whether this release takes the site root
        id: root
        if: steps.release.outputs.prerelease == 'false'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # Read gh-pages directly rather than the served site: this has to be right on the
          # first deploy, which happens before Pages is enabled by hand.
          published=$(mktemp)
          code=$(curl -sS -o "$published" -w '%{http_code}' \
            "https://raw.githubusercontent.com/${PUBLIC_REPO}/gh-pages/index.html")

          case "$code" in
            404)
              echo "No site root published yet; this release takes it."
              echo "take=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            200) ;;
            *)
              echo "::error::could not read the published site root (HTTP $code)."
              exit 1
              ;;
          esac

          current=$(grep -o '<link rel="canonical" href="[^"]*"' "$published" \
            | head -1 | sed 's|.*href="||; s|"$||')
          current="${current#"$DOCS_SITE_ROOT"}"
          current="${current%/}"
          if [ -z "$current" ]; then
            echo "::error::the published site root names no version; refusing to guess."
            exit 1
          fi

          # Only a stable release ever holds the root, and this step runs only for a stable
          # release, so both sides are plain X.Y.Z and a version sort settles it. Build
          # metadata is dropped, semver excluding it from precedence.
          newest=$(printf '%s\n%s\n' "${current%%+*}" "${VERSION%%+*}" | sort -V | tail -1)
          if [ "$newest" = "${VERSION%%+*}" ] && [ "$current" != "$VERSION" ]; then
            echo "Site root moves from $current to $VERSION."
            echo "take=true" >> "$GITHUB_OUTPUT"
          else
            echo "Site root stays at $current; $VERSION is not ahead of it."
            echo "take=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose the site root redirect
        if: steps.root.outputs.take == 'true'
        env:
          BASE_URL: ${{ steps.release.outputs.base_url }}
        run: |
          mkdir -p _root
          cat > _root/index.html <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <title>Gaming Couch for Unity</title>
          <meta http-equiv="refresh" content="0;URL=$BASE_URL">
          <link rel="canonical" href="$BASE_URL">
          <p>Redirecting to <a href="$BASE_URL">the current documentation</a>.</p>
          HTML

      # keep_files, unlike the deploy above, and for the opposite reason: this one publishes
      # at the root, where the cleanup would reach every version folder already published.
      - name: Point the site root at this release
        if: steps.root.outputs.take == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          external_repository: ${{ env.PUBLIC_REPO }}
          deploy_key: ${{ secrets.GAMING_COUCH_UNITY_PUBLIC_DEPLOY_KEY }}
          publish_branch: gh-pages
          publish_dir: _root
          keep_files: true
