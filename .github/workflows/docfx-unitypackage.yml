name: docfx-unitypackage

# Manual only. The action reads the package from the repository root, and the package lives in
# public/package/, so every one of its file guards takes the not-found branch: a run succeeds
# and deploys a gutted site over the docs URL baked into every published tag. Do not restore an
# automatic trigger until this workflow stages public/package/ as its root and deploys to the
# public repo.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build
        uses: deadsetbit/docfx-unitypackage@v1.0.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site
