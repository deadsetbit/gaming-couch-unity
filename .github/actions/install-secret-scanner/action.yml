name: install-secret-scanner
description: >-
  Install the pinned gitleaks binary and verify the download against its published checksum.
  Shared by every workflow that runs the publish gate, so the pinned version and hash exist in
  one place — a substituted binary would defeat the only automated check between this private
  repository and the public internet.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl -fsSL -o "/tmp/${archive}" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
        echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum -c -
        sudo tar -xzf "/tmp/${archive}" -C /usr/local/bin gitleaks
        gitleaks version
